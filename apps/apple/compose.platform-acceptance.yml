# Overlay compose.local.yml and compose.e2e.yml in project cognis-macos-platform-m2.
# Never share M1 project/volumes/port or saved production credentials.
services:
  cognis:
    image: cognis-macos-platform-m2:local
    ports: !override ["127.0.0.1:18763:8080"]
    environment:
      COGNIS_PUBLIC_BASE_URL: http://127.0.0.1:18763
      COGNIS_INITIAL_ADMIN_EMAIL: mac-companion@cognis-e2e.localdev.me
      COGNIS_INITIAL_ADMIN_PASSWORD: mac-companion-local-acceptance
  mock-llm:
    ports: !override []
  qdrant:
    ports: !override []
  mnemory:
    ports: !override []
  intaris:
    ports: !override []
  seed-e2e:
    image: cognis-macos-platform-m2:local
    environment:
      COGNIS_LOCAL_ADMIN_EMAIL: mac-companion@cognis-e2e.localdev.me
      COGNIS_LOCAL_ADMIN_PASSWORD: mac-companion-local-acceptance
